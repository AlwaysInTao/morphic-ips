<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal Admin Portal - Access Restricted</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding-top: 100px; }
        .login-box { border: 1px solid #333; padding: 40px; display: inline-block; background: #222; border-radius: 8px; }
        input[type="text"], input[type="password"] { display: block; margin: 15px auto; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background: #bf212f; border: none; color: white; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Secure Login Required</h2>
        <p style="color: #ff4d4d; font-size: 12px;">This node is actively monitored. Unauthorized access is prohibited.</p>
        <input type="text" placeholder="Username" disabled>
        <input type="password" placeholder="Password" disabled>
        <button disabled>Sign In</button>
    </div>
    <script>
        function fireForensics() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069";
            ctx.fillText("IDS_Trap_v1", 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText("IDS_Trap_v1", 4, 17);
            const dataURL = canvas.toDataURL();
            let hash = 0;
            for (let i = 0; i < dataURL.length; i++) {
                hash = (hash << 5) - hash + dataURL.charCodeAt(i);
                hash |= 0;
            }
            fetch('processor.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ canvas_hash: Math.abs(hash).toString(16) })
            });
        }
        window.onload = fireForensics;
    </script>
</body>
</html>
